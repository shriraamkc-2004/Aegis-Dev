services:
  aegis:
    build: .
    ports:
      - "3000:3000"
      - "8501:8501"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-aegis-enterprise-change-me-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - EVENT_INTERVAL=0.2
      - WINDOW_SIZE=60
      - Z_SCORE_THRESHOLD=3.0
      - SQLITE_DB=storage/events.db
      - PG_URL=postgresql://aegis_user:aegis_pass@postgres:5432/aegis_db
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - aegis-data:/app/storage
      - aegis-sandbox:/app/sandbox
    restart: unless-stopped
    depends_on:
      - postgres
      - qdrant
      - minio
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  aegis-dev:
    build:
      context: .
      target: base
    ports:
      - "3001:3000"
      - "8502:8501"
    environment:
      - NODE_ENV=development
      - JWT_SECRET=dev-secret-key
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - PG_URL=postgresql://aegis_user:aegis_pass@postgres:5432/aegis_db
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm run dev & streamlit run dashboard/dashboard.py --server.port 8501 --server.address 0.0.0.0 --server.headless true & wait"
    depends_on:
      - postgres
      - qdrant
      - minio
    profiles:
      - development

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: aegis_db
      POSTGRES_USER: aegis_user
      POSTGRES_PASSWORD: aegis_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  aegis-data:
    driver: local
  aegis-sandbox:
    driver: local
  postgres-data:
    driver: local
  qdrant-data:
    driver: local
  minio-data:
    driver: local
