# Aegis Enterprise — Render Blueprint
# Deploy the complete Aegis stack with one click on Render
# Docs: https://render.com/docs/blueprint-spec

services:
  # ─── Aegis Web Service (Node.js Backend + React Frontend) ───────────────────
  - type: web
    name: aegis-web
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/public/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MODE
        value: organization
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false # Set to your Upstash Redis or Render Redis connection string
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # Enter your Google Gemini API Key

  # ─── Aegis Security Copilot (Python AI Service) ─────────────────────────────
  - type: web
    name: aegis-copilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m copilot.server
    healthCheckPath: /health
    envVars:
      - key: COPILOT_PORT
        value: "8110"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false

databases:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  - name: aegis-postgres
    databaseName: aegis_enterprise
    user: aegis
    plan: free
